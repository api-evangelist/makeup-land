tools_file: mcp/makeup-land-mcp-tools.json
tool_count: 8
tools:
- name: list_products
  title: List / search products
  auth: anonymous for q / tag / brand / near_hex / hue_family / sort; bearer required when phone is passed
  rest_operation: listProducts
  input_schema: q, tag, brand, near_hex (^#?[0-9A-Fa-f]{6}$), hue_family (enum), sort (enum), limit (1-50), page, phone (^\+\d{6,15}$)
  execution: taskSupport forbidden
- name: list_brands
  title: List all brands
  auth: bearer
  rest_operation: listBrands
- name: validate_gift_card
  title: Validate a gift card code
  auth: public (gated on knowledge of the code)
  rest_operation: validateGiftCard
- name: get_customer
  title: Lookup customer by phone
  auth: bearer
  rest_operation: getCustomer
- name: get_cart
  title: Fetch a customer's cart
  auth: bearer + phone
  rest_operation: getCart
- name: list_orders
  title: List a customer's orders
  auth: bearer + phone
  rest_operation: listOrders
- name: list_payment_links
  title: List pending payment links
  auth: bearer + phone
  rest_operation: listPaymentLinks
- name: get_customer_best_deals
  title: Personalised best deals for a customer
  auth: bearer + phone
  rest_operation: getCustomerBestDeals
manifest_drift:
  manifest: well-known/makeup-land-mcp.json
  note: >-
    The /.well-known/mcp.json manifest lists 8 tools under REST-style camelCase names (listProducts,
    listBrands, getCustomer, getCart, addCartItem, listOrders, validateGiftCard, registerCustomer). The live
    server exposes 8 tools under snake_case names and a DIFFERENT set: it does NOT expose addCartItem or
    registerCustomer (the README confirms v1 is read-only — "No cart writes, no gift-card redeem, no customer
    registration. v2 adds these"), and it DOES expose list_payment_links and get_customer_best_deals, which
    the manifest omits. An agent that trusts the manifest will try two tools that do not exist and miss two
    that do. The live tools/list is the contract; the crosswalk binds the live names.
  manifest_only: [addCartItem, registerCustomer]
  live_only: [list_payment_links, get_customer_best_deals]
limitations_stated_by_provider:
- Read-only in v1 (no cart writes, gift-card redeem or registration) — https://github.com/makeup-land/makeup-land-mcp#limitations-of-v1
- Stateless — every request initialises a fresh MCP session
- Synchronous — tools/call blocks on the V1 fetch; semantic search up to 2s
- No SSE streaming for partial results
error_semantics: >-
  Tool errors propagate the V1 REST envelope {error, error_code} as text content with isError true; stable
  error_code values are the OpenAPI Error enum — see errors/makeup-land-problem-types.yml.
