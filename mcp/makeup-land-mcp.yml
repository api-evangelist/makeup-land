  server_info:
    name: makeup.land
    title: makeup.land MCP server
    version: 1.0.0
  instructions: >-
    makeup.land — Israeli professional cosmetics retailer. Use this MCP server to search the product catalog
    (with ΔE shade matching), look up customers by phone, fetch carts and orders, and validate gift cards. Most
