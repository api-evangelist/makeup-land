- id: pci-dss
  conforms: true
  basis: provider statement, unverified
  evidence: Terms of use (https://makeup.land/תנאי-שימוש) — "האתר עומד בתקן אבטחה מחמיר (PCI-DSS). סליקת כרטיסי האשראי מתבצעת על ידי חברת סליקה חיצונית ומאובטחת. פרטי האשראי של המשתמשים אינם נשמרים" (card processing by an external PCI-DSS processor; card data not stored by the operator). No attestation, AOC or trust page is published; this is a one-paragraph claim, not a compliance program.
domain_standards:
  sector: retail / e-commerce (cosmetics)
  note: >-
    Retail has no single contract standard the way finance has ISO 20022, but two agentic-commerce feed
    formats and one merchant-profile format are now the de facto standards for machine shopping, and
    makeup.land serves all three from its own host. These are recorded because they are observable
    documents, not claims.
  entries:
  - id: openai-agentic-commerce-protocol-product-feed
    conforms: true
    evidence: https://makeup.land/api/merchant/openai/products — 200 application/x-ndjson (5.9 MB); first line {"feed_id":"makeup-land-products","target_country":"IL"}, then one product object per line with id, title, url, media[], variants[]. Named "OpenAI ACP feed" in llms.txt, pricing.md and ai-manifest.json. The provider notes credits-only variants are dropped because ChatGPT checkout pays in fiat.
    location: feed, not a checkout endpoint — /.well-known/acp.json 404
  - id: google-merchant-center-rss-2.0
    conforms: true
    evidence: https://makeup.land/api/merchant/feed — 200 application/xml (2.6 MB); <rss version="2.0" xmlns:g="http://base.google.com/ns/1.0"> with g:id / g:title / g:description items.
  - id: google-product-reviews-2.4
    conforms: true
    basis: served; format as labelled by the provider
    evidence: https://makeup.land/api/merchant/reviews — 200 application/xml (2.7 MB); labelled "Google Product Reviews v2.4" in llms.txt and ai-manifest.json.
  - id: unified-commerce-profile
    conforms: true
    basis: served; provider-labelled "Google Unified Commerce Profile", profile_version 2026-04-08
    evidence: https://makeup.land/.well-known/ucp — 200 application/json; merchant, contact, currencies [ILS], regions_served [IL], payment_methods, fulfillment, return_policy {window_days 14}, feeds, capabilities.
  - id: schema.org-json-ld
    conforms: true
    evidence: Homepage carries 8 application/ld+json blocks — Organization (legalName, taxID 513942789, vatID IL513942789, address), two Store/LocalBusiness/HealthAndBeautyBusiness branches, WebSite with SearchAction; ai-manifest.json declares Product, BreadcrumbList, Organization, WebSite.
