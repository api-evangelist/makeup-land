method: searched
source: >-
  Live probes of makeup.land's discovery documents and feeds on 2026-09-19, the OpenAPI at
  https://makeup.land/openapi.json (securitySchemes, parameters, responses, info.description),
  https://makeup.land/auth.md, https://makeup.land/llms-full.txt, the MCP initialize result, the
  terms-of-use page, and the a2a/ grading in this repo. Each entry names the evidence it rests on.
standards:
- id: rfc9728-oauth-protected-resource-metadata
  conforms: true
  evidence: https://makeup.land/.well-known/oauth-protected-resource — 200 application/json; resource, authorization_servers, scopes_supported, bearer_methods_supported present. Saved at well-known/makeup-land-oauth-protected-resource.json.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: https://makeup.land/.well-known/oauth-authorization-server — 200 application/json with issuer and scopes_supported.
  caveat: >-
    authorization_endpoint and token_endpoint are null and grant_types_supported is empty. The document
    is published in RFC 8414 shape but describes an issuer with no OAuth flow; tokens are issued by email
    (agent_auth.identity_assertion.methods [email_manual]). Treat as metadata-present, flow-absent.
- id: oauth2
  conforms: false
  evidence: No oauth2 securityScheme in the OpenAPI; the authorization-server metadata declares no endpoints or grant types; auth.md states "no programmatic registration endpoint, no OTP claim ceremony, no anonymous flow".
- id: oidc
  conforms: false
  evidence: https://makeup.land/.well-known/openid-configuration — 404.
- id: rfc6750-bearer-token
  conforms: true
  evidence: OpenAPI securitySchemes.bearerAuth type http scheme bearer (bearerFormat ml_<hex24>); bearer_methods_supported [header] in the protected-resource metadata; live 401 {"error":"Unauthorized"} on GET /api/v1/brands without a token.
- id: workos-auth-md-agent-auth
  conforms: true
  evidence: https://makeup.land/auth.md — 200 text/markdown, declared "per the WorkOS auth.md skill format"; referenced from the RFC 8414 agent_auth.skill field and the RFC 9728 x-agent-auth-skill field. Saved verbatim at skills/makeup-land-auth.md.
- id: idempotency-key
  conforms: true
  evidence: Idempotency-Key header parameter declared on all 9 mutating operations in the OpenAPI (24h replay window, UUIDv4 recommended); info.description "Idempotency" section; auth.md and llms-full.txt restate it. See conventions/makeup-land-conventions.yml.
- id: pagination
  conforms: true
  style: page-number
  evidence: listProducts and listRegistrations take limit (1-50) and page (1-indexed) and return total, page, has_more (listProducts adds partial).
- id: rfc8594-sunset-header
  conforms: true
  basis: declared policy, not yet observable
  evidence: >-
    OpenAPI info.description "Versioning & deprecation policy" — "responses include the Deprecation: true and Sunset: <RFC 7231 HTTP-date> headers (per RFC 8594 / RFC 9745) for at least 6 months before the sunset date, with a Link rel=deprecation header". No V1 endpoint is currently deprecated, so no header has been observed.
- id: rfc9457-problem-details
  conforms: false
  evidence: All error responses are application/json {error, error_code} — no application/problem+json anywhere in the spec or on the live 400/401/404 responses.
- id: json-api
  conforms: false
  evidence: Plain JSON objects with resource-named top-level keys (products, brands, orders); no JSON:API media type or document structure.
