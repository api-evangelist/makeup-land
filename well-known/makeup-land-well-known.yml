summary:
  hosts_probed: 5
  paths_probed: 40
  documents_served: 6
  note: >-
    makeup.land serves an unusually complete agent-discovery surface from its apex: RFC 8414
    authorization-server metadata (carrying the WorkOS-style agent_auth extension), RFC 9728
    protected-resource metadata, an MCP discovery manifest, an A2A agent card, an AI usage manifest and
    a UCP merchant profile. It serves NO security.txt, NO OpenID configuration, NO RFC 9727 api-catalog,
    NO ai-plugin.json, NO AAuth resource document and NO APIs.json. The edge answers unknown top-level
    slugs with a 200 HTML catch-all page titled "<slug> - makeup.land" (a genuine 404 is a 62 KB Hebrew
    "page not found" body), so /apis.json, /apis.yml, /asyncapi.yaml and /asyncapi.json all return 200
    text/html and are recorded as misses. Under /.well-known/ the edge returns real 404s.
  mcp_host_note: >-
    The MCP server is https://makeup.land/api/mcp — on the apex host, not an mcp. subdomain — so the
    RFC 9728 document for the MCP resource is the apex one recorded below. mcp.makeup.land does not resolve.
  authorization_servers_note: >-
    /.well-known/oauth-protected-resource names authorization_servers ["https://makeup.land"] — the same
    host — so no third-party auth-server host needed probing.
