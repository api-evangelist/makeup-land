components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ml_<hex24>
      description: API bearer token issued under `api_tokens`. Prefix `ml_` is required. Per-token scope and `read_only` flag govern endpoint + write access.
    phoneIdentifier:
      type: apiKey
      in: query
      name: phone
      description: Phone number in E.164 format (e.g. `+972501234567`) that selects which customer's resources to return. **NOT a credential** — endpoints that accept this also REQUIRE `bearerAuth`. The bearer authenticates the calling partner; the phone selects the customer. For POST/PATCH cart-mutation endpoints, the phone goes in the JSON body instead of the query string.
  schemas: {}
x-scopes:
  full: Full read + write access. Default scope for first-party tokens.
  register: Issue new customer registrations and read registrations belonging to the token's `registration_source`. Restricted to the `/register` and `/registrations` endpoints.
  giftcards: Redeem gift cards. Required only by `POST /gift-cards/redeem`. The public `/gift-cards/validate` endpoint requires no token.
  proposals: Submit catalog enrichment proposals to `/proposals`. Read-only against the rest of the catalog.
  read_only: Marker for tokens whose `read_only=true` flag rejects every write. Not negotiated at request time — set at token issuance.
paths:
  /api/v1/brands:
    get:
      operationId: listBrands
      summary: List all brands with product counts
      description: Returns every brand surfaced on the storefront, sorted server-side. Use the `slug` value to look up products via `/api/v1/products?brand=<slug>`.
      tags:
      - Brands
      security:
      - bearerAuth:
        - full
      responses:
        '200':
          description: Brand directory
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  brands:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: English brand name
                        name_he:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: Hebrew brand name
                        slug:
                          type: string
                          description: URL-safe slug, e.g. `bali-body`
                        logo:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: Logo URL or null
                        product_count:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                      - name
                      - name_he
                      - slug
                      - logo
                      - product_count
                      additionalProperties: false
                required:
                - brands
                additionalProperties: false
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message (en or he, copy may shift)
                  error_code:
                    description: Stable machine-readable code. Optional today (legacy callers depend on the `error` string field); will become required in the next API version.
                    type: string
                    enum:
                    - invalid_json
                    - invalid_quantity
                    - invalid_phone
                    - invalid_parameter
                    - product_unavailable
                    - variant_mismatch
                    - tender_unavailable
                    - customer_not_found
                    - line_item_not_found
                    - registration_not_found
                    - insufficient_stock
                    - insufficient_credits
                    - line_collision
                    - phone_conflict
                    - validation_failed
                    - scope_mismatch
                    - read_only_token
                    - rate_limited
                    - unauthorized
                    - internal_error
                    - endpoint_not_found
                required:
                - error
                additionalProperties: {}
                description: Standard V1 error envelope. Additional fields may be present (e.g. `available_cents`, `requested_cents` on 409 insufficient_credits, `row_errors` on 422 validation failures).
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message (en or he, copy may shift)
                  error_code:
                    description: Stable machine-readable code. Optional today (legacy callers depend on the `error` string field); will become required in the next API version.
                    type: string
                    enum:
                    - invalid_json
                    - invalid_quantity
                    - invalid_phone
                    - invalid_parameter
                    - product_unavailable
                    - variant_mismatch
                    - tender_unavailable
                    - customer_not_found
                    - line_item_not_found
                    - registration_not_found
                    - insufficient_stock
                    - insufficient_credits
                    - line_collision
                    - phone_conflict
                    - validation_failed
                    - scope_mismatch
                    - read_only_token
                    - rate_limited
                    - unauthorized
                    - internal_error
                    - endpoint_not_found
                required:
                - error
                additionalProperties: {}
                description: Standard V1 error envelope. Additional fields may be present (e.g. `available_cents`, `requested_cents` on 409 insufficient_credits, `row_errors` on 422 validation failures).
  /api/v1/products:
    get:
      operationId: listProducts
      summary: Browse / search the catalog
      description: |-
        The primary catalog endpoint. Supports full-text + semantic search, brand/tag filtering, ΔE-ranked shade matching, per-customer reward projection, and dual-tender pricing (ILS + ℳ-credits).

        **Auth tiers**
        - Tag-only or no-arg listing: bearer token optional.
        - `q` / `phone` / `include=inventory` / `relevant_to_phone`: full-scope   bearer token required.

        **Precedence**: `near_hex` ranking dominates `sort`; `sort` dominates the implicit relevance ranking.
      tags:
      - Products
      security:
      - bearerAuth:
        - full
      - {}
      parameters:
      - name: q
        in: query
        required: false
        description: Free-text query. Triggers semantic + lexical search (union, rerank). Requires a bearer token when supplied without `tag`.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Free-text query. Triggers semantic + lexical search (union, rerank). Requires a bearer token when supplied without `tag`.
          type: string
      - name: tag
        in: query
        required: false
        description: EXACT tag-string filter (no translation, no substring). Matching is case-insensitive and whitespace-trimmed — `PRO+` and `pro+` are the same tag; tags come back lowercase. Catalog tags are Hebrew (e.g. שפתון, ביוטי, עיניים, שפתיים). For natural-language category lookup use `q`, which routes through semantic search.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: EXACT tag-string filter (no translation, no substring). Matching is case-insensitive and whitespace-trimmed — `PRO+` and `pro+` are the same tag; tags come back lowercase. Catalog tags are Hebrew (e.g. שפתון, ביוטי, עיניים, שפתיים). For natural-language category lookup use `q`, which routes through semantic search.
          type: string
      - name: brand
        in: query
        required: false
        description: Brand identifier. Matches name / slug / Hebrew name with whitespace and punctuation normalised — `Bali Body`, `balibody`, `bali-body` all collapse.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Brand identifier. Matches name / slug / Hebrew name with whitespace and punctuation normalised — `Bali Body`, `balibody`, `bali-body` all collapse.
          type: string
      - name: phone
        in: query
        required: false
        description: When supplied, the response embeds the customer's reward projection (`reward_earned` per product). Requires full-scope bearer token.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: When supplied, the response embeds the customer's reward projection (`reward_earned` per product). Requires full-scope bearer token.
          type: string
          pattern: ^\+\d{6,15}$
      - name: in_stock
        in: query
        required: false
        description: String boolean. `true` filters to in-stock variants only.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: String boolean. `true` filters to in-stock variants only.
          type: string
          enum:
          - 'true'
          - 'false'
      - name: max_price
        in: query
        required: false
        description: Max ILS price filter (decimal, e.g. `99.99`)
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Max ILS price filter (decimal, e.g. `99.99`)
          type: number
          minimum: 0
      - name: max_credit_cents
        in: query
        required: false
        description: Max ℳ-credit price filter in agorot
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Max ℳ-credit price filter in agorot
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - name: relevant_to_phone
        in: query
        required: false
        description: Re-rank results by relevance to this customer's past orders + tags. Requires full-scope bearer token.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Re-rank results by relevance to this customer's past orders + tags. Requires full-scope bearer token.
          type: string
          pattern: ^\+\d{6,15}$
      - name: include
        in: query
        required: false
        description: Comma-separated extra-field bundles. `inventory` adds `stock_by_location` and per-variant `available`. Requires full scope.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Comma-separated extra-field bundles. `inventory` adds `stock_by_location` and per-variant `available`. Requires full scope.
          type: string
      - name: limit
        in: query
        required: false
        description: Default 10. Capped at 50.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Default 10. Capped at 50.
          type: integer
          minimum: 1
          maximum: 50
      - name: page
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: integer
          minimum: 1
          maximum: 9007199254740991
      - name: near_hex
        in: query
        required: false
        description: Single `#RRGGBB` hex or comma-separated list (≤8). Returns products ranked by ΔE distance to the closest match.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Single `#RRGGBB` hex or comma-separated list (≤8). Returns products ranked by ΔE distance to the closest match.
          type: string
      - name: delta_e_max
        in: query
        required: false
        description: ΔE2000 cutoff used with `near_hex`. Default 80 single-hex, 200 multi-hex.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: ΔE2000 cutoff used with `near_hex`. Default 80 single-hex, 200 multi-hex.
          type: number
          minimum: 0
      - name: hue_family
        in: query
        required: false
        description: Comma-separated hue families. Post-filter — narrows results to products whose swatches fall in any of the listed families.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Comma-separated hue families. Post-filter — narrows results to products whose swatches fall in any of the listed families.
          type: string
      - name: sort
        in: query
        required: false
        description: Default `relevance`. `rating` uses a Bayesian shrinkage to avoid single-review products winning.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Default `relevance`. `rating` uses a Bayesian shrinkage to avoid single-review products winning.
          type: string
          enum:
          - price_asc
          - price_desc
          - popularity
          - rating
          - relevance
      - name: coverage
        in: query
        required: false
        description: How multi-value filters (tags, hue_family) combine. `all` (default) intersects; `any` unions.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: How multi-value filters (tags, hue_family) combine. `all` (default) intersects; `any` unions.
          type: string
          enum:
          - all
          - any
      responses:
        '200':
          description: Paginated catalog page
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id:
                          type: string
                          minLength: 1
                        title:
                          type: string
                        handle:
                          type: string
                          description: URL-safe slug
                        url:
                          type: string
                          format: uri
                        image_url:
                          anyOf:
                          - type: string
                            format: uri
                          - type: 'null'
                        images:
                          type: array
                          items:
                            type: string
                            format: uri
                        price:
                          type: number
                          minimum: 0
                          description: Amount in ILS as a decimal number (e.g. 12.50)
                        compare_at_price:
                          anyOf:
                          - type: number
                            minimum: 0
                            description: Amount in ILS as a decimal number (e.g. 12.50)
                          - type: 'null'
                        credit_price:
                          anyOf:
                          - type: integer
                            minimum: 0
                            maximum: 9007199254740991
                            description: Amount in integer agorot (100 = ₪1)
                          - type: 'null'
                        min_price:
                          type: number
                          minimum: 0
                          description: Amount in ILS as a decimal number (e.g. 12.50)
                        max_price:
                          type: number
                          minimum: 0
                          description: Amount in ILS as a decimal number (e.g. 12.50)
                        brand:
                          anyOf:
                          - type: object
                            properties:
                              slug:
                                anyOf:
                                - type: string
                                - type: 'null'
                              name:
                                anyOf:
                                - type: string
                                - type: 'null'
                            additionalProperties: false
                          - type: 'null'
                        product_type:
                          anyOf:
                          - type: string
                          - type: 'null'
                        in_stock:
                          type: boolean
                        description:
                          anyOf:
                          - type: string
                          - type: 'null'
                        tags:
                          type: array
                          items:
                            type: string
                        variants:
                          type: array
                          items:
                            type: object
                            properties:
                              variant_id:
                                type: string
                                minLength: 1
                              title:
                                anyOf:
                                - type: string
                                - type: 'null'
                              price:
                                type: number
                                minimum: 0
                                description: Amount in ILS as a decimal number (e.g. 12.50)
                              compare_at_price:
                                anyOf:
                                - type: number
                                  minimum: 0
                                  description: Amount in ILS as a decimal number (e.g. 12.50)
                                - type: 'null'
                              credit_price:
                                anyOf:
                                - type: integer
                                  minimum: 0
                                  maximum: 9007199254740991
                                  description: Amount in integer agorot (100 = ₪1)
                                - type: 'null'
                                description: ℳ-credit price in agorot. `null` for ILS-only variants.
                              in_stock:
                                type: boolean
                              image_url:
