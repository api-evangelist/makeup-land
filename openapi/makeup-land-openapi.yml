  /api/v1/proposals:
    post:
      operationId: submitProposals
      summary: Batch-submit catalog enrichment proposals
      description: Inserts new proposals after superseding any prior proposals for the same `(entity_id, field_name)` tuple. Snapshots the current ML value for the audit log. Batch is capped at 200 rows; larger payloads return 413.
      tags:
      - Proposals
      security:
      - bearerAuth:
        - full
        - proposals
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'Optional client-generated idempotency token (recommended: UUIDv4). Retries with the same key within 24h replay the original response.'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: 'Optional client-generated idempotency token (recommended: UUIDv4). Retries with the same key within 24h replay the original response.'
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              anyOf:
              - type: array
                items:
                  type: object
                  properties:
                    entity_type:
                      type: string
                      enum:
                      - product
                      description: Only `product` is accepted in Phase 3.
                    entity_id:
                      type: string
                      minLength: 1
                    field_name:
                      type: string
                      description: Field key from the ENRICH_FIELD_CONTRACT — e.g. `title_he`, `description_he`, `tags`, etc.
                    proposed_value: {}
                    source:
                      type: string
                      description: Provenance label — must be in ENRICH_PROPOSAL_SOURCES (e.g. `manual`, `shopify-import`, `gemini-2.5-pro`, `vps-1.5`).
                    source_detail:
                      type: string
                    confidence:
                      type: number
                      minimum: 0
                      maximum: 1
                    vector:
                      description: Optional embedding vector identifier
                      type: string
                    proposed_by:
                      type: string
                      description: Actor that produced the proposal (admin username, agent id, ...)
                    request_id:
                      type: string
                    source_urls:
                      description: HTTP(S) only. Other schemes are rejected at validation.
                      type: array
                      items:
                        type: string
                        format: uri
                    vps_confidence:
                      type: number
                      minimum: 0
                      maximum: 1
                  required:
                  - entity_type
                  - entity_id
                  - field_name
                  - proposed_value
                  - source
                  - proposed_by
                  additionalProperties: false
              - type: object
                properties:
                  proposals:
                    type: array
                    items:
                      type: object
                      properties:
                        entity_type:
                          type: string
                          enum:
                          - product
                          description: Only `product` is accepted in Phase 3.
                        entity_id:
                          type: string
                          minLength: 1
                        field_name:
                          type: string
                          description: Field key from the ENRICH_FIELD_CONTRACT — e.g. `title_he`, `description_he`, `tags`, etc.
                        proposed_value: {}
                        source:
                          type: string
                          description: Provenance label — must be in ENRICH_PROPOSAL_SOURCES (e.g. `manual`, `shopify-import`, `gemini-2.5-pro`, `vps-1.5`).
                        source_detail:
                          type: string
                        confidence:
                          type: number
                          minimum: 0
                          maximum: 1
                        vector:
                          description: Optional embedding vector identifier
                          type: string
                        proposed_by:
                          type: string
                          description: Actor that produced the proposal (admin username, agent id, ...)
                        request_id:
                          type: string
                        source_urls:
                          description: HTTP(S) only. Other schemes are rejected at validation.
                          type: array
                          items:
                            type: string
                            format: uri
                        vps_confidence:
                          type: number
                          minimum: 0
                          maximum: 1
                      required:
                      - entity_type
                      - entity_id
                      - field_name
                      - proposed_value
                      - source
                      - proposed_by
                      additionalProperties: false
                  discovered_image_urls:
                    type: array
                    items:
                      type: string
                      format: uri
                required:
                - proposals
                additionalProperties: false
              description: Either a bare array of proposals or `{ proposals, discovered_image_urls }`. When the envelope form is used, `discovered_image_urls` is denormalised onto every proposal.
      responses:
        '200':
          description: Counts of inserted + superseded rows
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  accepted:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  superseded:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - accepted
                - superseded
                additionalProperties: false
        '400':
          description: Invalid JSON or envelope
