    get:
      operationId: listOrders
      summary: List a customer's orders
      description: Returns the most recent orders for the customer identified by `phone` (E.164) or `email`. Exactly one identifier is required. Line items include per-line tender mode and ℳ-credit debit; payment status is the read-time projected value.
      tags:
      - Orders
      security:
      - bearerAuth:
        - full
      parameters:
      - name: phone
        in: query
        required: false
        description: Customer phone, E.164. Mutually exclusive with `email`.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Customer phone, E.164. Mutually exclusive with `email`.
          type: string
          pattern: ^\+\d{6,15}$
      - name: email
        in: query
        required: false
        description: Customer email. Mutually exclusive with `phone`.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Customer email. Mutually exclusive with `phone`.
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      - name: limit
        in: query
        required: false
        description: Max orders to return. Default 10.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Max orders to return. Default 10.
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Customer order history
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        order_number:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        order_number_text:
                          type: string
                          description: Display order number, e.g. `#1042`
                        email:
                          anyOf:
                          - type: string
                          - type: 'null'
                        phone:
                          anyOf:
                          - type: string
                          - type: 'null'
                        order_status:
                          type: string
                        payment_status:
                          type: string
                          description: Projected payment status — read-only view that maps unpaid orders with failed payments to `payment_failed` while leaving DB state untouched.
                        fulfillment_status:
                          type: string
                        return_status:
                          anyOf:
                          - type: string
                          - type: 'null'
                        subtotal:
                          type: number
                          minimum: 0
                          description: Amount in ILS as a decimal number (e.g. 12.50)
                        discount:
                          type: number
                          minimum: 0
                          description: Amount in ILS as a decimal number (e.g. 12.50)
                        shipping:
                          type: number
                          minimum: 0
                          description: Amount in ILS as a decimal number (e.g. 12.50)
                        total:
                          type: number
                          minimum: 0
                          description: Amount in ILS as a decimal number (e.g. 12.50)
                        refunded_amount:
                          type: number
                          minimum: 0
                          description: Amount in ILS as a decimal number (e.g. 12.50)
                        customer_name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        shipping_city:
                          anyOf:
