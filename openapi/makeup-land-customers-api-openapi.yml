openapi: 3.2.0
info:
  title: makeup.land Customers API
  version: 1.0.0
  summary: REST API for makeup.land — Hebrew-RTL professional cosmetics storefront with bilingual product data, ILS + ℳ-credit dual-tender pricing, and agent-friendly endpoints.
  description: All endpoints live under `/api/v1/`.
  contact:
    name: makeup.land
    url: https://makeup.land
  license:
    name: Proprietary
    url: https://makeup.land/terms-of-service
servers:
- url: https://makeup.land
  description: Production
tags:
- name: Customers
  description: Customer CRUD + tags + opportunities + best deals
paths:
  /api/v1/customers:
    get:
      operationId: getCustomer
      summary: Look up a customer by phone or email
      description: 'Exactly one of `phone` (E.164) or `email` must be supplied. Returns `customer: null` (200) when no match — the endpoint never 404s on lookup miss so polling clients can treat the response as a stable envelope.'
      tags:
      - Customers
      security:
      - bearerAuth:
        - full
      parameters:
      - name: phone
        in: query
        required: false
        description: Phone number in E.164 format, e.g. +972501234567
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          pattern: ^\+\d{6,15}$
          description: Phone number in E.164 format, e.g. +972501234567
      - name: email
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      responses:
        '200':
          description: Customer or null
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  customer:
                    anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        first_name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        last_name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        email:
                          anyOf:
                          - type: string
                          - type: 'null'
                        phone:
                          anyOf:
                          - type: string
                          - type: 'null'
                        avatar_url:
                          anyOf:
                          - type: string
                            format: uri
                          - type: 'null'
                        tags:
                          type: array
                          items:
                            type: string
                        city:
                          anyOf:
                          - type: string
                          - type: 'null'
                        address:
                          anyOf:
                          - type: string
                          - type: 'null'
                        total_spent:
                          type: number
                          minimum: 0
                          description: Amount in ILS as a decimal number (e.g. 12.50)
                        total_orders:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        created_at:
                          type: string
                          description: ISO-8601 timestamp, e.g. 2026-05-23T12:34:56.789Z
                        last_activity_at:
                          anyOf:
                          - type: string
                            description: ISO-8601 timestamp, e.g. 2026-05-23T12:34:56.789Z
                          - type: 'null'
                        credit_balance:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                          description: ℳ-credit wallet balance in agorot
                        credit_balance_formatted:
                          type: string
                          description: e.g. `ℳ12.50`
                      required:
                      - id
                      - name
                      - first_name
                      - last_name
                      - email
                      - phone
                      - avatar_url
                      - tags
                      - city
                      - address
                      - total_spent
                      - total_orders
                      - created_at
                      - last_activity_at
                      - credit_balance
                      - credit_balance_formatted
                      additionalProperties: false
                    - type: 'null'
                required:
                - customer
                additionalProperties: false
        '400':
          description: Missing identifier or invalid phone
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message (en or he, copy may shift)
                  error_code:
                    description: Stable machine-readable code. Optional today (legacy callers depend on the `error` string field); will become required in the next API version.
