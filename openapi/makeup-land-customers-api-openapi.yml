  /api/v1/customers/{id}/tags:
    patch:
      operationId: patchCustomerTags
      summary: Add / remove / replace tags on a customer
      description: 'Order of application: `replace → remove → add`. Tags are matched case-insensitively (`Pro` == `pro`) and stored normalized (trimmed, lower-case); the final set is deduplicated. Emits `customer.tags_changed` on actual change.'
      tags:
      - Customers
      security:
      - bearerAuth:
        - full
      parameters:
      - name: id
        in: path
        required: true
        description: Customer ID
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          minLength: 1
          description: Customer ID
      - name: Idempotency-Key
        in: header
        required: false
        description: 'Optional client-generated idempotency token (recommended: UUIDv4). Retries with the same key within 24h replay the original response.'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: 'Optional client-generated idempotency token (recommended: UUIDv4). Retries with the same key within 24h replay the original response.'
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                add:
                  type: array
                  items:
                    type: string
                remove:
                  type: array
                  items:
                    type: string
                replace:
                  description: Map of `old_tag → new_tag` applied before remove/add
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
              additionalProperties: false
      responses:
        '200':
          description: Tags mutated
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  customer_id:
                    type: string
                    minLength: 1
                  tags:
                    type: array
                    items:
                      type: string
                  tags_added:
                    type: array
                    items:
                      type: string
                  tags_removed:
                    type: array
                    items:
                      type: string
                  tags_replaced:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      type: string
                required:
                - customer_id
                - tags
                - tags_added
                - tags_removed
                - tags_replaced
                additionalProperties: false
        '400':
          description: No tag operations supplied
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message (en or he, copy may shift)
                  error_code:
                    description: Stable machine-readable code. Optional today (legacy callers depend on the `error` string field); will become required in the next API version.
                    type: string
                    enum:
                    - invalid_json
                    - invalid_quantity
                    - invalid_phone
                    - invalid_parameter
                    - product_unavailable
                    - variant_mismatch
                    - tender_unavailable
                    - customer_not_found
                    - line_item_not_found
                    - registration_not_found
                    - insufficient_stock
                    - insufficient_credits
                    - line_collision
                    - phone_conflict
                    - validation_failed
                    - scope_mismatch
                    - read_only_token
                    - rate_limited
                    - unauthorized
                    - internal_error
                    - endpoint_not_found
                required:
                - error
                additionalProperties: {}
                description: Standard V1 error envelope. Additional fields may be present (e.g. `available_cents`, `requested_cents` on 409 insufficient_credits, `row_errors` on 422 validation failures).
        '403':
          description: Read-only token or scope mismatch
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
