    post:
      operationId: upsertCustomer
      summary: Create or update a customer (bulk-import friendly)
      description: Creates the customer if missing, otherwise patches the existing row. Tag operations are additive — submitted tags are merged with the existing set (case-insensitively; stored lower-case); no tag removal happens here. Deliberately does NOT fire the welcome-bonus path; use `/api/v1/register` for trusted onboarding.
      tags:
      - Customers
      security:
      - bearerAuth:
        - full
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'Optional client-generated idempotency token (recommended: UUIDv4). Retries with the same key within 24h replay the original response.'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: 'Optional client-generated idempotency token (recommended: UUIDv4). Retries with the same key within 24h replay the original response.'
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                phone:
                  type: string
                  pattern: ^\+\d{6,15}$
                  description: Phone number in E.164 format, e.g. +972501234567
                name:
                  description: Required when creating a new customer
                  type: string
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                tags:
                  description: Tags to union in. Tag identity is case-insensitive (`Pro` == `pro`); tags are stored normalized (trimmed, lower-case).
                  type: array
                  items:
                    type: string
              required:
              - phone
              additionalProperties: false
      responses:
        '200':
          description: Updated existing customer
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
