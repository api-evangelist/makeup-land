  /api/v1/registrations:
    get:
      operationId: listRegistrations
      summary: Paginated registration audit log
      description: Register-scoped tokens see only registrations belonging to the token's `registration_source`. Full-scope tokens see everything.
      tags:
      - Register
      security:
      - bearerAuth:
        - full
        - register
      parameters:
      - name: phone
        in: query
        required: false
        description: Phone number in E.164 format, e.g. +972501234567
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
          pattern: ^\+\d{6,15}$
          description: Phone number in E.164 format, e.g. +972501234567
      - name: status
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
      - name: tag
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: string
      - name: from
        in: query
        required: false
        description: Inclusive lower bound on registered_at
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Inclusive lower bound on registered_at
          type: string
      - name: to
        in: query
        required: false
        description: Exclusive upper bound on registered_at
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Exclusive upper bound on registered_at
          type: string
      - name: limit
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: integer
          minimum: 1
          maximum: 100
      - name: page
        in: query
        required: false
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: integer
          minimum: 1
          maximum: 9007199254740991
      responses:
        '200':
          description: Registration audit page
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  registrations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                        phone:
                          type: string
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        email:
                          anyOf:
                          - type: string
                          - type: 'null'
                        tags:
                          type: array
                          items:
                            type: string
                        status:
                          type: string
                        created:
                          type: boolean
                        customer_id:
                          type: string
                          minLength: 1
                        webhook_status:
                          anyOf:
                          - type: string
                          - type: 'null'
                        whatsapp_status:
                          anyOf:
                          - type: string
                          - type: 'null'
                        registered_at:
                          type: string
                          description: ISO-8601 timestamp, e.g. 2026-05-23T12:34:56.789Z
                      required:
                      - id
                      - phone
                      - name
                      - email
                      - tags
                      - status
                      - created
                      - customer_id
                      - webhook_status
                      - whatsapp_status
                      - registered_at
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  page:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  has_more:
                    type: boolean
                required:
                - registrations
                - total
                - page
                - has_more
                additionalProperties: false
        '401':
          description: Missing bearer token
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message (en or he, copy may shift)
                  error_code:
                    description: Stable machine-readable code. Optional today (legacy callers depend on the `error` string field); will become required in the next API version.
                    type: string
                    enum:
                    - invalid_json
                    - invalid_quantity
                    - invalid_phone
                    - invalid_parameter
                    - product_unavailable
                    - variant_mismatch
                    - tender_unavailable
                    - customer_not_found
                    - line_item_not_found
                    - registration_not_found
                    - insufficient_stock
                    - insufficient_credits
                    - line_collision
                    - phone_conflict
                    - validation_failed
                    - scope_mismatch
                    - read_only_token
                    - rate_limited
                    - unauthorized
