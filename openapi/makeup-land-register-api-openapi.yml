openapi: 3.2.0
info:
  title: Makeup Land Register API
  version: 1.0.0
  contact:
    name: makeup.land
    url: https://makeup.land
  license:
    name: Proprietary
    url: https://makeup.land/terms-of-service
  description: 'Operations tagged Register across 2 of this provider''s published API definitions: makeup-land-openapi.json, makeup-land-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://makeup.land
  description: Production
tags:
- name: Register
  description: External registration intake + audit
paths:
  /api/v1/register:
    post:
      operationId: registerCustomer
      summary: Trusted customer registration intake (WA-inbound + partner)
      description: Designed to be invoked by `wa.makeup.land` on every inbound WhatsApp contact (WA delivery proves phone ownership) or by partner systems with a `register`-scoped token. Orchestrates customer create/update, tag merge, webhook dispatch, WhatsApp template, and on first insert materialises M-Club static opportunities. WA template + webhooks fire only when `created === true`. Returns 201 on create, 200 on update.
      tags:
      - Register
      security:
      - bearerAuth:
        - full
        - register
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'Optional client-generated idempotency token (recommended: UUIDv4). Retries with the same key within 24h replay the original response.'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: 'Optional client-generated idempotency token (recommended: UUIDv4). Retries with the same key within 24h replay the original response.'
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                phone:
                  type: string
                  pattern: ^\+\d{6,15}$
                  description: Phone number in E.164 format, e.g. +972501234567
                name:
                  type: string
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                tag:
                  description: Convenience single-tag shortcut. Merged with `tags` if both supplied.
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                team:
                  description: '`yes` marks the customer as part of the team. Off by default.'
                  type: string
                  enum:
                  - 'yes'
                profile_pic_url:
                  description: Avatar source URL. Must be HTTPS and resolve to an allowlisted host (`*.whatsapp.net`, `*.fbcdn.net`). SSRF-guarded.
                  type: string
                  format: uri
                referred_by_code:
                  description: Referral code — written once on insert, never updated.
                  type: string
                referral_source:
                  type: string
              required:
              - phone
              additionalProperties: false
      responses:
        '200':
          description: Existing customer updated
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  customer:
                    type: object
                    properties: {}
                    additionalProperties: {}
                  created:
                    type: boolean
                  webhook:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - sent
                        - skipped
                        - failed
                        - disabled
                      status_code:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      attempts:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      error:
                        type: string
                    required:
                    - status
                    additionalProperties: false
                  whatsapp:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - sent
                        - skipped
                        - failed
                        - disabled
                      template:
                        type: string
                      error:
                        type: string
                    required:
                    - status
                    additionalProperties: false
                  tags_added:
                    type: array
                    items:
                      type: string
                  tags_already_present:
                    type: array
                    items:
                      type: string
                required:
                - status
                - customer
                - created
                - webhook
                - whatsapp
                additionalProperties: false
        '201':
          description: New customer created
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
