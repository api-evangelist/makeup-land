                      webhook:
                        type: object
                        properties:
                          status:
                            type: string
                          url:
                            anyOf:
                            - type: string
                              format: uri
                            - type: 'null'
                          status_code:
                            anyOf:
                            - type: integer
                              minimum: -9007199254740991
                              maximum: 9007199254740991
                            - type: 'null'
                          attempts:
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                        required:
                        - status
                        - url
                        - status_code
                        - attempts
                        additionalProperties: false
                      whatsapp:
                        type: object
                        properties:
                          status:
                            type: string
                          template:
                            anyOf:
                            - type: string
                            - type: 'null'
                        required:
                        - status
                        - template
                        additionalProperties: false
                    required:
                    - id
                    - phone
                    - name
                    - email
                    - tags
                    - status
                    - created
                    - customer_id
                    - webhook_status
                    - whatsapp_status
                    - registered_at
                    - webhook
                    - whatsapp
                    additionalProperties: false
                required:
