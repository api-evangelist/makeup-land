apis:
- aid: makeup-land:makeup-land-v1-api
  name: makeup.land V1 API
  description: >-
    REST API for the makeup.land storefront under https://makeup.land/api/v1 — 21 operations across
    Products (cross-lingual q, exact Hebrew tag, brand, ΔE 2000 near_hex shade matching, hue_family, sort),
    Brands, Customers (lookup, upsert, tags, M Club opportunities, best deals), Cart (get, add, patch,
    delete, clear — all idempotent), Orders (read-only, six status axes), Gift Cards (public validate,
    scoped redeem), Payment Links, Register (partner onboarding with webhook + WhatsApp dispatch) and
    Proposals (catalog enrichment). Bearer ml_ tokens with scopes full / register / giftcards / proposals
    and a read_only flag; phone (E.164) selects the customer on phone-keyed endpoints.
  humanURL: https://makeup.land/llms-full.txt
  baseURL: https://makeup.land/api/v1
