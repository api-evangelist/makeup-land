- aid: makeup-land:makeup-land-mcp-server
  name: makeup.land MCP Server
  description: >-
    Remote Model Context Protocol server at https://makeup.land/api/mcp — Streamable HTTP, stateless,
    protocol revision 2025-06-18. initialize and tools/list answer anonymously; 8 read-only tools
    (list_products with ΔE shade matching, list_brands, validate_gift_card, get_customer, get_cart,
    list_orders, list_payment_links, get_customer_best_deals). Catalog and gift-card tools work without
    credentials; customer tools take the same ml_ bearer as the REST API plus an E.164 phone. Listed in the
    Official MCP Registry as land.makeup/v1; the first-party GitHub repo holds server.json, smithery.yaml
    and an integrator guide. The /.well-known/mcp.json manifest drifts from the live tool list.
  humanURL: https://github.com/makeup-land/makeup-land-mcp
  baseURL: https://makeup.land/api/mcp
