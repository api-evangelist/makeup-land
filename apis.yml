aid: makeup-land
name: א. ט. הפקות בע״מ / A.T. Hafakot Ltd.
description: >-
  makeup.land, operated by א. ט. הפקות בע״מ / A.T. Hafakot Ltd. (company no. 513942789, Zikhron Yaakov and
  Haifa, Israel), is a Hebrew-first professional cosmetics retailer carrying ~1,550 products from 34+ brands,
  with ℳ-credit loyalty wallet, M Club tiers, gift cards and a virtual try-on. It publishes a 21-operation
  OpenAPI 3.1 contract at makeup.land/openapi.json — product search with CIE ΔE 2000 shade matching and
  cross-lingual semantic search, customers and wallet, carts, orders, gift cards, payment links, partner
  registration and catalog proposals — every write idempotent via Idempotency-Key, bearer tokens issued by
  email with four scopes. Alongside it: a live remote MCP server at makeup.land/api/mcp (8 read-only tools,
  anonymous tools/list, Official MCP Registry land.makeup/v1), RFC 8414 and RFC 9728 OAuth metadata with a
  WorkOS-style auth.md, an A2A-shaped agent card, an ai-manifest and UCP merchant profile, llms.txt with
  markdown twins, and Google Merchant and OpenAI ACP product feeds.
