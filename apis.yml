  name: makeup.land Merchant & Agentic Commerce Feeds
  description: >-
    Public, token-free catalog feeds under https://makeup.land/api/merchant — a Google Merchant Center RSS
    2.0 product feed (/feed), a Google Product Reviews 2.4 feed (/reviews) and an OpenAI Agentic Commerce
    Protocol JSON Lines product feed (/openai/products; credits-only variants omitted because ChatGPT
    checkout pays in fiat). Declared in llms.txt, pricing.md, the ai-manifest and the UCP merchant profile.
  humanURL: https://makeup.land/llms.txt
